[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "research-institution"
version = "0.1.0"
description = "Aggregator for math-engine + pi_monitor + math research programs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Andrei Prokopiw", email = "aprokopiw@users.noreply.github.com"},
]
# Runtime deps. The provider plugin (research-institution owns the
# WorkSourceProvider slot per @ADR-0007) imports mathlint's
# `program_providers` types at module load time. This is the
# kernel/OS dependency: the OS imports the kernel's type system
# but NOT any proof-program modules (@ADR-0014). All other
# sub-checks still invoke mathlint as a separate subprocess;
# the import here is purely for the provider registration API.
dependencies = [
  "typer>=0.12",
  "mathlint @ git+https://github.com/aprokopiw/kaplansky-research-program.git@main",
]

# mathlint.providers entry point. Per @ADR-0007, research-institution
# owns the WorkSourceProvider slot in mathlint. Mathlint's
# discover_program_providers() loads the SOLE installed entry point
# in this group. If both research-institution and kaplansky are
# installed simultaneously, mathlint raises on collision; this
# is intentional — one OS per machine.
[project.entry-points."mathlint.providers"]
research_institution = "research_institution.providers.research_institution_provider:register"

# Dev deps pin the three sibling repos at their current versions.
# When the institution grows its semantic-record catalogue to
# cite these as `@INV-NNNN` "institution expected pins" records,
# they become the canonical anchors. Today the pins are operator
# judgment, governed by `@CTR-0088`.
[dependency-groups]
dev = [
  "mathlint @ git+https://github.com/aprokopiw/kaplansky-research-program.git@v0.1.0",
  "kaplansky-research-program @ git+https://github.com/aprokopiw/math-kaplansky.git@v0.1.0",
  "pi-monitor @ git+https://github.com/aprokopiw/pi_monitor.git@v0.2.0",
  "pytest>=8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["research_institution"]

# (research_institution/ is reserved for any future Python glue
# this repo might need. Today the repo is scripts + docs + tests
# only; no Python package. The packages = ["research_institution"]
# declaration is forward-compatible.)

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["tests"]

[tool.ruff.lint]
# V0 rule set. See docs/operations/verification-gates.md for rationale.
# Excluded by design:
#   E501 — long lines are formatting; `ruff format` is the formatter.
#          Long f-strings in error messages are clearer than wrapping.
#   S101 — pytest uses `assert` semantically.
#   S603 — all subprocess callsites pass argv lists (no shell=True).
#   S607 — operator-PATH resolution is intentional; the institution
#          assumes mathlint / pi-monitor / bash are on PATH.
select = ["E", "F", "W", "B", "S", "UP", "N", "PIE", "RET", "SIM"]
ignore = ["E501", "S101", "S104", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Test files use `assert` for pytest semantics; allow S101 globally
# but still flag any other rule.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
