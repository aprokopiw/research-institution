# Critical mutants + their killer tests.
#
# Cited contracts:
#   @CTR-0101-release-gate-contract
#   @ADR-0096-audit-close-out-runtime-evidence
#   @ADR-0014-program-agnostic-mathlint-imports
#   @ADR-0091-mathlint-ships-no-program-launchers
#
# Each [[mutant]] entry pins one regression-prone mutation
# scenario. The ``killer_test`` is the node-id of the unit
# test that catches the mutation at the source; the
# ``scenario`` field is set when the killer is a verify-
# simulation scenario rather than a unit test.
#
# This file is the durable data input to the mutation-test
# gate aggregator (research_institution.gates.verify_simulation
# .mutation.MutationAggregator). It lives in the production
# source tree so a fresh agent reading the release-gate
# contract can resolve the data source without traversing
# transient paths.
#
# Schema (stable; bump schema_version on any breaking change):
#
#   schema_version : int
#   source         : the durable anchor or file that enumerates these mutants
#   [[mutant]]
#   id             : stable mutant identifier (M-NN)
#   description    : what mutation this catches
#   killer_test    : pytest node-id of the killer test, or "UNRESOLVED"
#   scenario       : optional verify-simulation scenario name
#   source         : the source file the mutation is anchored to

schema_version = 1
source = "research-institution/research_institution/gates/verify_simulation/mutation_critical_mutants.toml"

# M1..M5 come from the canonical mutation-survival test
# (tests/test_mutation_survival.py). Each entry pins a
# regression that would otherwise slip through snapshot-only
# tests.

[[mutant]]
id = "M1"
description = "Status enum: a swap of superseded and cancelled would collapse two distinct reconcile actions into one."
killer_test = "tests/test_mutation_survival.py::StatusEnumMutationTests::test_m1_supersede_and_cancel_produce_distinct_actions"
scenario = ""
source = "tests/test_mutation_survival.py"

[[mutant]]
id = "M2"
description = "OperatorRequired must not collapse into Wait; a regression that maps OperatorRequired -> wait would silently drop operator-required audits."
killer_test = "tests/test_mutation_survival.py::OperatorRequiredVsWaitMutationTests::test_m2_operator_required_does_not_become_wait"
scenario = ""
source = "tests/test_mutation_survival.py"

[[mutant]]
id = "M3"
description = "Empty work list is not a successful dispatch; the supervisor must emit a Wait with reason_code=no_eligible_work rather than park silently."
killer_test = "tests/test_mutation_survival.py::EmptyWorkListMutationTests::test_m3_dispatch_carries_at_least_one_work_request"
scenario = ""
source = "tests/test_mutation_survival.py"

[[mutant]]
id = "M4"
description = "Reason code aliasing (e.g. reissued rewritten to reactivated) would let consumers misread the verdict; canonical names must hold."
killer_test = "tests/test_mutation_survival.py::ReasonCodeAliasingMutationTests::test_m4_reason_codes_use_canonical_names"
scenario = ""
source = "tests/test_mutation_survival.py"

[[mutant]]
id = "M5"
description = "Idempotency key collision: dropping source_identity from canonical_key would let two distinct programs share a record."
killer_test = "tests/test_mutation_survival.py::IdempotencyKeyCollisionMutationTests::test_m5_distinct_sources_have_distinct_keys"
scenario = ""
source = "tests/test_mutation_survival.py"

