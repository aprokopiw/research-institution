# catalog/programs.toml — the institution's in-flight research
# programs. Each entry satisfies `catalog/schema.toml`. Tests
# in `tests/test_catalog_consistent.py` enforce the schema.

[[programs]]
name = "kaplansky"
display_name = "Kaplansky Research Program"
repository = "https://github.com/aprokopiw/math-kaplansky"
entry_point = "kaplansky.mathlint_plugin:register"
local_path = "$HOME/Documents/andrei/kaplansky"
mathlint_pin = "v0.1.0"
live_credentials_required = true
# Per @ADR-0001: kaplansky authenticates via pi's OpenAI Codex OAuth grant
# (stored in ~/.pi/agent/auth.json), not an OpenAI Platform API key. The
# `OPENAI_API_KEY` env var is therefore absent from this list — mathlint
# delegates auth for openai-codex/* routes to `pi auth check` and never
# reads OPENAI_API_KEY. See docs/semantic/adr/adr-0001-*.md.
live_credential_env_vars = ["MATHLINT_MODEL_ROUTE"]
check_program_script = "scripts/check-program-institution.sh"
# Marker files that identify a directory as belonging to this
# program. The OS layer (research-institution) uses these as a
# secondary resolution key: when ``local_path`` does NOT match
# the supervised repo (e.g. tests, fresh checkouts, ops-driven
# mirrors), the OS still resolves the program name as long as
# ANY marker file exists under the repo root.
#
# Catalog-driven, never hardcoded in OS source. Adding a program
# means adding its markers here.
program_markers = ["programs/kaplansky-roadmap.toml", "src/kaplansky/work_selection.py"]
