# type-escapes.toml
#
# Central ledger of every approved escape from the strict-type policy
# declared in .specify/memory/constitution.md. Per Constitution
# Principle VI, escapes are approved only after the three-strikes
# protocol (TypeAlias / NewType / Protocol / Generic all attempted).
#
# Per Constitution Principle VIII, every entry below carries an inline
# reason: why the escape exists, what it leaves untyped, and whether
# the upstream type can ever be tightened.
#
# Format: each table entry is a TOML array of tables; CI tooling
# (research_institution/gates/type_escape_audit.py) reads this file
# and greps the source tree for `# type: ignore` / `cast(` /
# `Any` markers not declared here.
#
# A non-empty file means the codebase has untyped escapes. The
# policy target is zero.

# Empty ledger: the typed-envelope package was consolidated into
# ``research_institution.contracts.source_decision`` (which
# re-exports pi_monitor's frozen dataclasses by identity, so there
# is no type drift between the OS provider, the math kernel, and
# the supervisor). Every typed envelope in the institution is now
# statically checked at compile time with no escapes needed.
escapes = []
